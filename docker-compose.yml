services:
  ollama:
    image: ollama/ollama:latest
    container_name: ministral-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    restart: unless-stopped

  inferencia:
    build:
      context: .
      dockerfile: Dockerfile
    image: ministral-inferencia:1.0
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./results:/app/results
    profiles:
      - pruebas

volumes:
  ollama_models: